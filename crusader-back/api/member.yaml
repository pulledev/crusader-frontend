openapi: 3.0.3
info:
  title: Crusader API
  version: 0.0.1
  description: Example workspace
tags:
  - name: member
    description: Member related operations
servers:
  - url: http://localhost:8080
    description: Local development server
paths:
  /member:
    post:
      tags:
        - member
      summary: Create member
      description: Creates a new record of type Member.
      operationId: createMember
      security:
        - BearerJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberCreate"
      responses:
        '201':
          description: The request was successful, and a new resource was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /member/{id}:
    get:
      tags:
        - member
      summary: Get member
      description: Returns a record of type Member.
      operationId: getMember
      security:
        - BearerJwt: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Successfully retrieved the member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - member
      summary: Update member
      description: Updates a record of type Member.
      operationId: updateMember
      security:
        - BearerJwt: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdate"
      responses:
        '200':
          description: Successfully updated the member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags:
        - member
      summary: Patch member
      description: Partially updates a record of type Member.
      operationId: partialUpdateMember
      security:
        - BearerJwt: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberPartialUpdate"
      responses:
        '200':
          description: Successfully patched the member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - member
      summary: Delete member
      description: Deletes a record of type Member.
      operationId: removeMember
      security:
        - BearerJwt: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: The request was successful, but there is no content to return.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  schemas:
    Member:
      type: object
      required:
        - name
        - membershipType
        - steamId
        - discordId
        - discordNick
      properties:
        name:
          type: string
          example: "Max"
        rank:
          $ref: "#/components/schemas/Rank"
        stab:
          type: array
          items:
            $ref: "#/components/schemas/Stab"
        unitRole:
          $ref: "#/components/schemas/UnitRole"

        membershipType:
          $ref: "#/components/schemas/Membership_Type"

        points:
          type: number
          example: 100
        steamId:
          type: string
          example: "A11111111111"
        discordId:
          type: string
          example: "011111111111"
        discordNick:
          type: string
          example: "Max Brain"
        created_at:
          type: string
          format: date-time
          example: "2025-11-04 22:39:40.061613+00"
        updated_at:
          type: string
          format: date-time
          example: "2025-11-04 22:39:40.061613+00"
      description: Representation of a member

    MemberCreate:
      type: object
      required:
        - name
        - membershipTypeId
        - steamId
        - discordId
        - discordNick
      properties:
        name:
          type: string
          example: "Max"
        rankLevel:
          type: integer
          example: 1
        stabIds:
          type: array
          items:
            type: integer
            example: 1
        unitRoleId:
          type: integer
          example: 1
        membershipTypeId:
          type: integer
          example: 1

        points:
          type: number
          example: 100
        steamId:
          type: string
          example: "A11111111111"
        discordId:
          type: string
          example: "011111111111"
        discordNick:
          type: string
          example: "Max Brain"
      description: Representation of a member creation

    MemberUpdate:
      type: object
      required:
        - name
        - membershipTypeId
        - rankLevel
        - stabIds
        - points
        - steamId
        - discordId
        - discordNick
      properties:
        name:
          type: string
          example: "Max"
        rankLevel:
          type: integer
          example: 1
        stabIds:
          type: array
          items:
            type: integer
            example: 1
        unitRoleId:
          type: integer
          example: 1
        membershipTypeId:
          type: integer
          example: 1

        points:
          type: number
          example: 100
        steamId:
          type: string
          example: "A11111111111"
        discordId:
          type: string
          example: "011111111111"
        discordNick:
          type: string
          example: "Max Brain"
      description: Representation of a member update

    MemberPartialUpdate:
      type: object
      properties:
        name:
          type: string
          example: "Max"
        rankLevel:
          type: integer
          example: 1
        stabIds:
          type: array
          items:
            type: integer
            example: 1
        unitRoleId:
          type: integer
          example: 1
        membershipTypeId:
          type: integer
          example: 1

        points:
          type: number
          example: 100
        steamId:
          type: string
          example: "A11111111111"
        discordId:
          type: string
          example: "011111111111"
        discordNick:
          type: string
          example: "Max Brain"
      description: Representation of a partial member update

    Rank:
      type: object
      required:
        - level
        - name
        - created_at
        - updated_at
      properties:
        level:
          type: integer
          example: 1
        name:
          type: string
          example: "Gefreiter"
        created_at:
          type: string
          format: date-time
          example: "2025-11-04 22:39:40.061613+00"
        updated_at:
          type: string
          format: date-time
          example: "2025-11-04 22:39:40.061613+00"

    Stab:
      type: object
      required:
        - id
        - name
        - description
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "S6"
        description:
          type: string
          example: "Technische Administration"
        created_at:
          type: string
          format: date-time
          example: "2025-11-04 22:39:40.061613+00"
        updated_at:
          type: string
          format: date-time
          example: "2025-11-04 22:39:40.061613+00"
    UnitRole:
      type: object
      required:
        - id
        - unit
        - name
        - description
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          example: 1
        unit:
          $ref: "#/components/schemas/Unit"
        name:
          type: string
          example: "Funker"
        description:
          type: string
          example: "Funkt mit TOC"
        created_at:
          type: string
          format: date-time
          example: "2025-11-04 22:39:40.061613+00"
        updated_at:
          type: string
          format: date-time
          example: "2025-11-04 22:39:40.061613+00"
    Unit:
      type: object
      required:
        - id
        - name
        - description
        - discord_role_id
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Alpha"
        description:
          type: string
          example: "Angriffs Element"
        discord_role_id:
          type: string
          example: "111111111111"
        created_at:
          type: string
          format: date-time
          example: "2025-11-04 22:39:40.061613+00"
        updated_at:
          type: string
          format: date-time
          example: "2025-11-04 22:39:40.061613+00"
    Membership_Type:
      type: object
      required:
        - id
        - name
        - discordRoleId
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Anwärter"
        discordRoleId:
          type: string
          example: "A1111111111"
        created_at:
          type: string
          format: date-time
          example: "2025-11-04 22:39:40.061613+00"
        updated_at:
          type: string
          format: date-time
          example: "2025-11-04 22:39:40.061613+00"



  responses:
    Conflict:
      description: The request could not be completed due to a conflict with the current state of the resource.
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string
    NotFound:
      description: The server cannot find the requested resource.
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string
    Forbidden:
      description: The server understood the request, but refuses to authorize it.
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string
    BadRequest:
      description: The server could not understand the request due to invalid syntax.
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string
              errors:
                type: array
                items:
                  type: object
                  properties:
                    message:
                      type: string
    Unauthorized:
      description: Authentication is required to access the requested resource.
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string
    InternalServerError:
      description: The server encountered an unexpected condition that prevented it from fulfilling the request.
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string

  parameters:
    id:
      in: path
      required: true
      name: id
      schema:
        type: string
      description: discord_id (primary key of a member)

  securitySchemes:
    BearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
