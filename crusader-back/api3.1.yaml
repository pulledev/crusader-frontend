info:
  title: APIFiddle Sample Definition
  version: 0.0.0
  description: Example workspace
tags:
  - name: member
    description: member related stuff
paths:
  /member:
    post:
      tags:
        - member
      summary: Create member
      security:
        - BearerJwt: []
      responses:
        "201":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemberCreate"
                title: CreateMemberCreated
          description: The request was successful, and a new resource was created.
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerErrror"
      description: Creates a new record of type Member.
      operationId: createMember
      parameters:
        - in: query
          name: data
          required: true
          style: form
          description: ""
          explode: true
          schema:
            $ref: "#/components/schemas/MemberCreate"
          allowReserved: false
  /member/{id}:
    get:
      tags:
        - member
      summary: Get member
      security:
        - BearerJwt: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
          description: The request was successful, and the server has returned the the
            member object in the response body.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerErrror"
      parameters:
        - $ref: "#/components/parameters/id"
      description: Returns a record of type Member.
      operationId: getMember
    put:
      tags:
        - member
      summary: Update member
      security:
        - BearerJwt: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberUpdate"
          description: The request was successful, and the server has returned the updated
            member in the response body.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerErrror"
      parameters:
        - $ref: "#/components/parameters/id"
      description: Updates a record of type Member.
      operationId: updateMember
    patch:
      tags:
        - member
      summary: Patch member
      security:
        - BearerJwt: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberPartialUpdate"
          description: The request was successful, and the server has returned the
            partially updated member in the response body.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerErrror"
      parameters:
        - $ref: "#/components/parameters/id"
      description: Partially updates a record of type Member.
      operationId: partialUpdateMember
    delete:
      tags:
        - member
      summary: Delete member
      security:
        - BearerJwt: []
      responses:
        "204":
          content:
            application/json:
              schema:
                type: "null"
                title: RemoveMemberNoContent
          description: The request was successful, but there is no content to return in
            the response.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerErrror"
      parameters:
        - $ref: "#/components/parameters/id"
      description: Deletes a record of type Member.
      operationId: removeMember
openapi: 3.1.0
servers:
  - url: https://api.ksk-crusader.de/v1
    description: ""
components:
