        - name
        - discord_id
        - steam_id
        - rank
        - points
        - created_at
        - unit
        - stab
        - membership_type
        - discord_nick
        - updated_at
      properties:
        name:
          type: string
        rank:
          type: string
        stab:
          type: array
          items:
            type: string
        unit:
          type: string
        points:
          type: string
        steam_id:
          type: string
        created_at:
          type: string
        discord_id:
          type: string
        updated_at:
          type: string
        discord_nick:
          type: string
        membership_type:
          type: string
      description: |
        Represantiation of a member
    MemberCreate:
      type: object
      required:
        - name
        - rank
        - points
        - steam_id
        - discord_id
        - unit
        - stab
        - membership_type
        - discord_nick
      properties:
        name:
          type: string
        rank:
          type: string
        stab:
          type: array
          items:
            type: string
        unit:
          type: string
        points:
          type: string
        steam_id:
          type: string
        discord_id:
          type: string
        discord_nick:
          type: string
        membership_type:
          type: string
      x-fiddle-dto-info:
        baseSchemaName: Member
    MemberUpdate:
      type: object
      required:
        - name
        - rank
        - points
        - steam_id
        - discord_id
        - unit
        - stab
        - membership_type
        - discord_nick
      properties:
        name:
          type: string
        rank:
          type: string
        stab:
          type: array
          items:
            type: string
        unit:
          type: string
        points:
          type: string
        steam_id:
          type: string
        discord_id:
          type: string
        discord_nick:
          type: string
        membership_type:
          type: string
      x-fiddle-dto-info:
        baseSchemaName: Member
    MemberSummary:
      type: object
      required:
        - name
        - discord_id
        - steam_id
        - rank
        - points
        - created_at
        - unit
        - stab
        - membership_type
        - discord_nick
        - updated_at
      properties:
        name:
          type: string
        rank:
          type: string
        stab:
          type: array
          items:
            type: string
        unit:
          type: string
        points:
          type: string
        steam_id:
          type: string
        created_at:
          type: string
        discord_id:
          type: string
        updated_at:
          type: string
        discord_nick:
          type: string
        membership_type:
          type: string
      description: A simplified representation of a Member, typically used in list views.
      x-fiddle-dto-info:
        baseSchemaName: Member
    MemberPartialUpdate:
      type: object
      required:
        - name
        - rank
        - points
        - steam_id
        - discord_id
        - unit
        - stab
        - membership_type
        - discord_nick
      properties:
        name:
          type: string
        rank:
          type: string
        stab:
          type: array
          items:
            type: string
        unit:
          type: string
        points:
          type: string
        steam_id:
          type: string
        discord_id:
          type: string
        discord_nick:
          type: string
        membership_type:
          type: string
      x-fiddle-dto-info:
        baseSchemaName: Member
  responses:
    Conflict:
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string
      description: The request could not be completed due to a conflict with the
        current state of the resource. Resolve the conflict and try again.
    NotFound:
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string
      description: The server cannot find the requested resource. The endpoint may be
        invalid or the resource may no longer exist.
    Forbidden:
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string
      description: The server understood the request, but refuses to authorize it.
        Ensure the client has appropriate permissions.
    BadRequest:
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              errors:
                type: array
                items:
                  type: object
                  required:
                    - message
                  properties:
                    message:
                      type: string
              message:
                type: string
      description: The server could not understand the request due to invalid syntax.
        The client should modify the request and try again.
    Unauthorized:
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string
      description: Authentication is required to access the requested resource. The
        client must include the appropriate credentials.
    InternalServerErrror:
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string
      description: The server encountered an unexpected condition that prevented it
        from fulfilling the request. Report the issue to the support team if it
        persists.
  parameters:
    id:
      in: path
      name: id
      style: simple
      schema:
        type: string
      explode: false
      description: discord_id bcs its the primary key of a member
      allowReserved: false
      allowEmptyValue: true
  securitySchemes:
    BearerJwt:
      type: http
      scheme: Bearer
      bearerFormat: Json Web Token (JWT)
