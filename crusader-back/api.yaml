openapi: 3.0.3
info:
  title: Crusader API
  version: 0.0.1
  description: Example workspace
tags:
  - name: member
    description: Member related operations
servers:
  - url: http://localhost:8080
    description: Local development server
paths:
  /member:
    post:
      tags:
        - member
      summary: Create member
      description: Creates a new record of type Member.
      operationId: createMember
      security:
        - BearerJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberCreate"
      responses:
        '201':
          description: The request was successful, and a new resource was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /member/{id}:
    get:
      tags:
        - member
      summary: Get member
      description: Returns a record of type Member.
      operationId: getMember
      security:
        - BearerJwt: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Successfully retrieved the member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - member
      summary: Update member
      description: Updates a record of type Member.
      operationId: updateMember
      security:
        - BearerJwt: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdate"
      responses:
        '200':
          description: Successfully updated the member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags:
        - member
      summary: Patch member
      description: Partially updates a record of type Member.
      operationId: partialUpdateMember
      security:
        - BearerJwt: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberPartialUpdate"
      responses:
        '200':
          description: Successfully patched the member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - member
      summary: Delete member
      description: Deletes a record of type Member.
      operationId: removeMember
      security:
        - BearerJwt: []
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: The request was successful, but there is no content to return.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  schemas:
    Member:
      type: object
      required:
        - name
        - discord_id
        - steam_id
        - rank
        - points
        - created_at
        - unit
        - stab
        - membership_type
        - discord_nick
        - updated_at
      properties:
        name:
          type: string
        rank:
          type: string
        stab:
          type: array
          items:
            type: string
        unit:
          type: string
        points:
          type: string
        steam_id:
          type: string
        created_at:
          type: string
        discord_id:
          type: string
        updated_at:
          type: string
        discord_nick:
          type: string
        membership_type:
          type: string
      description: Representation of a member

    MemberCreate:
      type: object
      required:
        - name
        - points
        - steam_id
        - discord_id
        - discord_nick
        - membership_type
      properties:
        name:
          type: string
        rank:
          type: integer
        stab:
          type: integer
          items:
            type: integer
        unit:
          type: integer
        points:
          type: integer
        steam_id:
          type: string
        discord_id:
          type: string
        discord_nick:
          type: string
        membership_type:
          type: integer

    MemberUpdate:
      type: object
      required:
        - name
        - rank
        - points
        - steam_id
        - discord_id
        - unit
        - stab
        - membership_type
        - discord_nick
      properties:
        name:
          type: string
        rank:
          type: string
        stab:
          type: array
          items:
            type: string
        unit:
          type: string
        points:
          type: string
        steam_id:
          type: string
        discord_id:
          type: string
        discord_nick:
          type: string
        membership_type:
          type: string

    MemberPartialUpdate:
      type: object
      properties:
        name:
          type: string
        rank:
          type: string
        stab:
          type: array
          items:
            type: string
        unit:
          type: string
        points:
          type: string
        steam_id:
          type: string
        discord_id:
          type: string
        discord_nick:
          type: string
        membership_type:
          type: string

  responses:
    Conflict:
      description: The request could not be completed due to a conflict with the current state of the resource.
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string
    NotFound:
      description: The server cannot find the requested resource.
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string
    Forbidden:
      description: The server understood the request, but refuses to authorize it.
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string
    BadRequest:
      description: The server could not understand the request due to invalid syntax.
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string
              errors:
                type: array
                items:
                  type: object
                  properties:
                    message:
                      type: string
    Unauthorized:
      description: Authentication is required to access the requested resource.
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string
    InternalServerError:
      description: The server encountered an unexpected condition that prevented it from fulfilling the request.
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string

  parameters:
    id:
      in: path
      required: true
      name: id
      schema:
        type: string
      description: discord_id (primary key of a member)

  securitySchemes:
    BearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
