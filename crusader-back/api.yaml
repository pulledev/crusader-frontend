openapi: "3.0.0"
info:
  version: 0.0.1
  title: Crusader API
paths:
  /ping:
    get:
      responses:
        '200':
          description: pet response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pong'

  /members:
    get:
      responses:
        '200':
          description: list of members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
components:
  schemas:
    # base types
    Pong:
      type: object
      required:
        - ping
      properties:
        ping:
          type: string
          example: pong
    Member:
      type: array
      properties:
        name:
          type: string
